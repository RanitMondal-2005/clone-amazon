<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon.com.clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <!-- NAVIGATION BAR -->
        <div class="navbar">
            <!-- Navigation Logo -->
            <div class="nav-logo border">
                <div class="logo"></div>
            </div>
            <!-- Delivery Address & Location -->
            <div class="nav-address border">
                <p class="add-first">Deliver to</p>
                <div class="address-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <p class="add-second">India</p>
                </div>
            </div>
            <!-- Search Bar in Navigation -->
            <div class="nav-search">
                <select class="search-search" > 
                <!-- for drop down menu -->
                    <option>All</option>
                    <option>Arts & Crafts</option>
                    <option>Automotive</option>
                    <option>Electronics</option>
                    <option>Girls Fashion</option>
                    <option>Deals</option>
                    <option>Health & Household</option>
                    <option>Health & Kitchen</option>
                    <option>Prime Video</option>
                    <option>Alexa</option>
                    <option>Toys & Games</option>
                    <option>Men's Fashion</option>
                    <option>Women's Fashion</option>
                </select>
                <input type="text" placeholder="Search Amazon" class="search-input">
                <div class="search-icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </div>
            </div>
            <!-- Flag & Language -->
            <div class="nav-language border">
                <div class="flag-container">
                    <img src="https://upload.wikimedia.org/wikipedia/en/4/41/Flag_of_India.svg" class="india-flag" alt="India Flag">
                </div>
                <span class="lang-text">IN</span>
            </div>
            <!-- Accounts & Sign-in -->
            <div class="nav-signing border">
                <p class="nav-signing-1st">
                    <span>Hello,sign in</span>
                </p>
                <p class="text-box">
                    Accounts & Lists <i class="fa-solid fa-angle-down"></i>
                </p>
            </div>
            <!-- Returns & Orders -->
            <div class="returns border">
                <p><span class="nav-signing-1st">Returns</span></p>
                <p class="text-box">& Orders</p>
            </div>
            <!-- Shopping Bucket and Cart -->
            <div class="nav-cart border">
                <i class="fa-solid fa-cart-arrow-down"></i>
                Cart
            </div>
        </div>
        <!-- PANEL 2 -->
        <div class="pannel ">
            <!-- Pannel logo & All -->
            <div class="pannel-all border"><i class="fa-solid fa-bars"></i>ALL</div>
            <!-- Pannel Options -->
            <div class="pannel-ops border">
                <p>Today's Deals</p>
                <p>Prime Video</p>
                <p>Registry</p>
                <p>Gift Cards</p>
                <p>Customer Service</p>
                <p>Sell</p>
            </div>
        </div>
    </header>

</body>
</html>
